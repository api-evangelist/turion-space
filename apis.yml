aid: turion-space
name: Turion Space
description: >-
  Turion Space is an Irvine, California aerospace company founded in 2021 (Y Combinator S21) that
  designs, builds and operates DROID maneuverable spacecraft for space domain awareness, non-earth
  imaging and in-orbit servicing, alongside the STARFIRE software platform for mission planning,
  autonomous tasking and command-and-control across Turion and third-party constellations. Its
  customer-facing surface is the STARFIRE dashboard at starfire.turionspace.com, backed by a
  first-party REST API gateway at api.app.turionspace.com that issues per-user API keys and meters
  imagery tasking and Starfire NEXUS jobs against a Stripe-billed credit balance. The company
  publishes no public developer portal, API reference, or machine-readable specification; the entire
  contract sits behind the STARFIRE customer login.
