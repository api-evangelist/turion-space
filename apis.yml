apis:
- name: Turion Space STARFIRE API
  description: >-
    First-party REST API gateway behind the STARFIRE customer dashboard. Route prefixes observed in
    the provider's own published dashboard bundle include /api/v1/tasking-orders, /api/v1/images/,
    /api/v1/turion/images/, /api/v1/nexus/builds, /api/v1/nexus/start-job, /api/v1/credits/balance,
    /api/v1/organizations/event-settings, /api/v1/stripe/checkout-session and /api/v1/users/api-key.
    The gateway is live and answers anonymously with a JSON envelope ({"error_msg":"404 Route Not
    Found"}, Go/Echo), but every route requires an authenticated STARFIRE session or API key and no
    public reference or specification is published.
  humanURL: https://starfire.turionspace.com/
  baseURL: https://api.app.turionspace.com
